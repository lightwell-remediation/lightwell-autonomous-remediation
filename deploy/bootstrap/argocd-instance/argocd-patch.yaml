---
# Patch of the instance the operator already created. We deliberately do not own
# this object, see ADR-0006: two owners of an operator singleton fight forever.
# Only the field below is set, everything else stays operator defaulted.
#
# The RBAC policy is not here on purpose. It is a single string, so applying
# it replaces whatever is there — on an RHDP cluster that came with GitOps,
# that is the catalog item's own policy. install-gitops.sh adds our two lines
# only where they are missing.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # The operator default limit is 2Gi and the controller OOMKills around it once
  # a full app set reconciles (seen on rhoaibu-cluster-nightly). Our app set is
  # smaller, but a crash loop during the first sync is expensive to debug.
  controller:
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: 250m
        memory: 1Gi
