---
# Workaround TC-7588 (docs/workarounds.md). The importer refuses credentials
# read from files ("file credential source is disabled") unless
# IMPORTER_CREDENTIAL_PATHS lists the directory, and the operator's chart has no
# value for it (verified on 3.1.2: `modules.importer.credentialPaths` and
# `extraEnv` are both ignored). So set it on the Deployment once the operator
# has created it. The operator leaves fields it does not own alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpa-importer-patcher
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpa-importer-patcher
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["importer"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpa-importer-patcher
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpa-importer-patcher
subjects:
  - kind: ServiceAccount
    name: tpa-importer-patcher
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tpa-importer-credential-paths
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: tpa-importer-patcher
      restartPolicy: OnFailure
      containers:
        - name: patch
          image: {{ .Values.credentialPathsJob.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # The Deployment appears after the create-db and migrate-db jobs.
              for _ in $(seq 1 90); do
                oc get deployment importer -n {{ .Values.namespace }} >/dev/null 2>&1 && break
                sleep 10
              done
              oc set env deployment/importer -n {{ .Values.namespace }} \
                IMPORTER_CREDENTIAL_PATHS=/run/secrets/{{ .Values.lightwell.credentialsSecret }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
