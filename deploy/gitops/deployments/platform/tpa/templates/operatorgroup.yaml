---
# Single namespace install: the operator only watches its own namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: lightwell-tpa
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetNamespaces:
    - {{ .Values.namespace }}
