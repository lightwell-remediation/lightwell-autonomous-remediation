---
# Subscription only.
#
# The operator creates a TektonConfig named "config" with profile all, which
# brings Pipelines, Triggers and Pipelines as Code. We deliberately do not own
# that object: it is an operator defaulted singleton, and two owners of one of
# those fight forever (ADR-0006). Tune it with oc patch if ever needed.
operator:
  namespace: openshift-operators
  name: openshift-pipelines-operator-rh
  # latest resolves to openshift-pipelines-operator-rh.v1.24.1 in the catalog.
  channel: latest
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  startingCSV: ""

# The Pipelines entry in the web console. Since OpenShift Pipelines 1.22 it
# only exists with the console plugin enabled — the static entry that used to
# appear regardless was removed (1.22 release notes, Breaking changes). The
# operator creates the ConsolePlugin, but only the console's "Enable" button
# lists it in console.operator spec.plugins; a Subscription from git never does.
# The Console is a cluster singleton shared with other plugins (ODF,
# monitoring, networking), so a PostSync Job appends this one instead of
# owning the list.
consolePlugin:
  enabled: true
  name: pipelines-console-plugin
  image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
