{{- if .Values.operator.operatorGroup.enabled }}
---
# Empty spec means all namespaces, which is the only mode RHOAI supports.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhods-operator
  namespace: {{ .Values.operator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec: {}
{{- end }}
