{{- if .Values.operator.operatorGroup.enabled }}
---
# Single namespace install, so the operator only watches its own namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: lightwell-developer-hub
  namespace: {{ .Values.operator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetNamespaces:
    - {{ .Values.operator.namespace }}
{{- end }}
