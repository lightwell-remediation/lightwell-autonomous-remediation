---
# The identity agent runs use. It needs no Kubernetes API access: the agent
# talks to MaaS and to GitHub, not to the cluster. Pulling the namespace
# ImageStream works without extra RBAC, since every ServiceAccount in a
# namespace is an image-puller there by default. So there is no Role here on
# purpose, and if a later phase needs one it should say why in the diff.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: lightwell
