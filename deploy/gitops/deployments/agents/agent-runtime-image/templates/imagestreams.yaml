---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Values.images.base }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: lightwell
spec:
  lookupPolicy:
    local: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Values.images.runtime }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: lightwell
spec:
  # Lets a pod in this namespace reference the tag by short name.
  lookupPolicy:
    local: true
