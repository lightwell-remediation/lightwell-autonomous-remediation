---
name: CI — Secrets Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets in committed files
        run: |
          echo "=== Checking for secret patterns ==="
          FOUND=0

          # Deny-list filenames
          for pattern in "*.env" ".env.*" "env.local" "*.key" "*.pem" "*.p12" "*.pfx" \
                         "kubeconfig*" "*.kubeconfig" ".git-credentials" ".netrc" \
                         "credentials.json" "service-account.json" "*-sa.json" \
                         "*token*.txt" "*token*.json"; do
            MATCHES=$(git ls-files "$pattern" 2>/dev/null | grep -v '.template.env' | grep -v '.example' || true)
            if [ -n "$MATCHES" ]; then
              echo "FAIL: Denied file pattern '$pattern' found: $MATCHES"
              FOUND=1
            fi
          done

          # Content patterns.
          #
          # Both token formats this project actually uses were missed before:
          #   - the MaaS key is sk- followed by base64url, so underscores and
          #     dashes break a [a-zA-Z0-9]{20,} run
          #   - the GitHub credential is either github_pat_ (the fine grained
          #     PAT ADR-0003 mandates) or gho_ from the gh CLI, never ghp_
          # A scanner that cannot catch your own credentials is decoration.
          PATTERNS='(AKIA[0-9A-Z]{16}'
          PATTERNS+='|sk-[A-Za-z0-9_-]{20,}'
          PATTERNS+='|github_pat_[A-Za-z0-9_]{36,}'
          PATTERNS+='|gh[pousr]_[A-Za-z0-9]{36,}'
          PATTERNS+='|glpat-[A-Za-z0-9_-]{20}'
          PATTERNS+='|xox[baprs]-[A-Za-z0-9-]{10,}'
          PATTERNS+='|BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY)'
          HITS=$(git grep -lP "$PATTERNS" -- ':!.github/workflows/ci-secrets-scan.yaml' 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: Secret-like content found in: $HITS"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "Secret scan failed. Remove credentials and use environment variables or sealed secrets."
            exit 1
          fi

          echo "OK: No secrets detected."
